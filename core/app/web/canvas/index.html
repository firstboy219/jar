<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Papan JARVIS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" tabindex="-1"></div>
<div id="cursor" hidden></div>

<header class="topbar" id="topbar">
  <div class="tb-left">
    <strong class="brand">JARVIS</strong>
    <select id="galaxy" aria-label="Papan"></select>
    <span id="title"></span><span id="count"></span>
  </div>
  <div class="tb-right" id="tb-right">
    <button id="search" class="pill" title="Cari kartu atau tambahkan dari Simpanan (Ctrl+K)"><span>Cari</span><kbd>Ctrl K</kbd></button>
    <button id="follow" class="pill" title="Kamera ikut ke tugas baru yang kamu minta">Ikuti</button>
    <button id="projectsbtn" class="pill" title="Proyek: tim pekerja, model, jadwal">🗂 Proyek</button>
    <button id="lastact" class="pill" title="Bawa aku ke tempat permintaan terakhirku di kanvas">🕘 Terakhir</button>
    <button id="history" class="pill">Riwayat</button>
    <button id="gesture" class="pill" title="Kendali tangan lewat kamera — di perangkat ini saja">Gestur</button>
    <a class="pill btnlink weblink" href="/notes/" title="Catatan & Tugas (ala Notion)">Catatan</a>
    <a class="pill btnlink weblink" href="/notes/#meetings" title="Rapat: notulen, transkrip, tanya rapat">Rapat</a>
    <a id="admin" class="pill btnlink" target="_blank" rel="noopener" title="Halaman admin: titik kendali (persetujuan kode, pengaturan)">Admin</a>
    <button id="logout" class="pill" title="Keluar dari papan di browser ini">Keluar</button>
  </div>
</header>

<section id="history-panel" class="panel" hidden></section>

<div id="gesture-box">
  <video id="camera" playsinline muted></video>
  <div id="gesture-hud">kamera mati</div>
</div>
<div id="toasts"></div>

<div id="login" hidden>
  <form id="login-form">
    <h2>Papan JARVIS</h2>
    <p>Masuk dengan password halaman admin. Browser ini lalu mendapat token perangkat sendiri (bisa dicabut di menu Perangkat).</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password admin" required>
    <button type="submit">Masuk</button>
    <p id="login-error" role="alert"></p>
  </form>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
