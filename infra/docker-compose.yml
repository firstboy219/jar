# JARVIS — server stack
# Based on BRD §FSD-2, with these deliberate deviations (see docs/decisions.md):
#   - all secrets come from .env (never committed)
#   - image tags are pinned; no :latest
#   - only 80/443 are public; NPM admin and Qdrant bind to 127.0.0.1
#   - OpenClaw is deferred; Hermes Agent runs alone first
#   - jarvis-core fronts the agent (vis1); Hermes is internal-only and acts through jarvis-tools (MCP)
#
# Usage:  cd infra && ./scripts/init-env.sh && docker compose up -d --build

name: jarvis

networks:
  jarvis-network:
    driver: bridge

services:
  # 1. REVERSE PROXY & SSL TERMINATION
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: jarvis-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81" # admin UI: ssh -L 8181:localhost:81
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - jarvis-network

  # 1b. WEB ADMIN PANEL (FS-105) — https://${FRONTEND_DOMAIN}
  # Edits .env; host systemd unit jarvis-apply.path runs `docker compose up -d`. No Docker socket.
  admin:
    build: ./admin
    image: jarvis-admin:local
    container_name: jarvis-admin
    restart: always
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    volumes:
      - ./.env:/config/.env
      - ./data/admin:/status:ro
      - ./data/releases:/releases:ro
    environment:
      - ADMIN_PUBLIC_ORIGIN=https://${FRONTEND_DOMAIN}
    networks:
      - jarvis-network

  # 2. REASONING ENGINE (Hermes Agent, includes Playwright/Chromium)
  hermes-agent:
    image: nousresearch/hermes-agent:v0.22.2
    container_name: jarvis-brain
    restart: always
    command: ["gateway", "run"]
    shm_size: "1gb" # Chromium needs more than the 64MB default; safer than BRD's ipc: host
    volumes:
      - ./data/hermes:/opt/data
      - ./hermes/03-jarvis-config:/etc/cont-init.d/03-jarvis-config:ro
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro # JARVIS persona (versioned in git)
      # Cross-app visibility (FS-104), read-only
      - ./data/npm/logs:/opt/external/proxy_logs:ro
    environment:
      - HERMES_UID=${HOST_UID:-1000}
      - HERMES_GID=${HOST_GID:-1000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HERMES_INFERENCE_PROVIDER=openrouter
      - HERMES_INFERENCE_MODEL=${JARVIS_DEFAULT_MODEL}
      # Tier 3: model Hermes delegates to (delegate_task) when it decides it needs more capability
      - JARVIS_EXPERT_MODEL=${JARVIS_EXPERT_MODEL}
      # OpenAI-compatible API, reachable only inside jarvis-network (called by jarvis-core)
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY}
      # Tools (memory, approvals, n8n) come from jarvis-tools; Hermes holds no n8n/Qdrant keys
      - MCP_TOKEN=${MCP_TOKEN}
    networks:
      - jarvis-network
    depends_on:
      - jarvis-tools

  # 2b. CORE SERVICE — https://${BACKEND_DOMAIN}: device auth, WSS, tiered routing, approvals,
  #     memory, usage. The only public entry point to the agent.
  jarvis-core:
    build: ../core
    image: jarvis-core:local
    container_name: jarvis-core
    restart: always
    environment: &core-env
      - DATABASE_URL=postgresql://jarvis_core:${JARVIS_DB_PASSWORD}@jarvis-db/jarvis
      - HERMES_API_KEY=${HERMES_API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - JARVIS_CODER_MODEL=${JARVIS_CODER_MODEL}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-2}
      - DEEPGRAM_KEYWORDS=${DEEPGRAM_KEYWORDS:-}
      - CORE_ADMIN_TOKEN=${CORE_ADMIN_TOKEN}
      - MCP_TOKEN=${MCP_TOKEN}
      - TZ=${TZ}
    networks:
      - jarvis-network
    depends_on:
      core-db-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  # 2c. MCP TOOL SERVER for Hermes (internal only): memory, approval requests, n8n drafts
  jarvis-tools:
    image: jarvis-core:local
    container_name: jarvis-tools
    restart: always
    command: ["python", "-m", "app.mcp_server"]
    environment: *core-env
    networks:
      - jarvis-network
    depends_on:
      jarvis-core:
        condition: service_started

  # one-shot: least-privilege role + database for jarvis-core (idempotent)
  core-db-init:
    image: postgres:16.15-alpine
    restart: "no"
    entrypoint: ["/init-core-db.sh"]
    volumes:
      - ./postgres/init-core-db.sh:/init-core-db.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JARVIS_DB_PASSWORD=${JARVIS_DB_PASSWORD}
    networks:
      - jarvis-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. WORKFLOW AUTOMATION
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    container_name: jarvis-executor
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=jarvis-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_HOST=${FLOW_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${FLOW_DOMAIN}/
      - WEBHOOK_URL=https://${FLOW_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - jarvis-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # 4. SEMANTIC MEMORY (vector DB)
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: jarvis-memory
    restart: always
    ports:
      - "127.0.0.1:6333:6333" # dashboard: ssh -L 6333:localhost:6333
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - jarvis-network

  # 5. RELATIONAL PERSISTENCE
  postgres-db:
    image: postgres:16.15-alpine
    container_name: jarvis-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-network
