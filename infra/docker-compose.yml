# JARVIS — server stack
# Based on BRD §FSD-2, with these deliberate deviations (see docs/decisions.md):
#   - all secrets come from .env (never committed)
#   - image tags are pinned; no :latest
#   - only 80/443 are public; NPM admin and Qdrant bind to 127.0.0.1
#   - OpenClaw dropped (never installed); jarvis-core is the gateway (WSS, admin API, LLM gateway)
#   - jarvis-core fronts the agent (vis1); Hermes is internal-only and acts through jarvis-tools (MCP)
#
# Usage:  cd infra && ./scripts/init-env.sh && docker compose up -d --build

name: jarvis

networks:
  jarvis-network:
    driver: bridge

services:
  # 1. REVERSE PROXY & SSL TERMINATION
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: jarvis-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81" # admin UI: ssh -L 8181:localhost:81
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - jarvis-network

  # 1b. WEB ADMIN PANEL (FS-105) — https://${FRONTEND_DOMAIN}
  # Edits .env; host systemd unit jarvis-apply.path runs `docker compose up -d`. No Docker socket.
  admin:
    build: ./admin
    image: jarvis-admin:local
    container_name: jarvis-admin
    restart: always
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    volumes:
      - ./.env:/config/.env
      - ./data/admin:/status:ro
      - ./data/releases:/releases:ro
    environment:
      - ADMIN_PUBLIC_ORIGIN=https://${FRONTEND_DOMAIN}
    networks:
      - jarvis-network

  # 2. REASONING ENGINE (Hermes Agent, includes Playwright/Chromium) — CPU class 2 (yields to voice/chat)
  # Every model call goes through jarvis-core's LLM gateway (ADR-017); Hermes holds no provider keys.
  hermes-agent:
    image: nousresearch/hermes-agent:v0.22.2
    container_name: jarvis-brain
    restart: always
    command: ["gateway", "run"]
    shm_size: "1gb" # Chromium needs more than the 64MB default; safer than BRD's ipc: host
    cpu_shares: 256
    mem_limit: 4g
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop: [NET_RAW, MKNOD, AUDIT_WRITE, SYS_CHROOT]
    volumes:
      - ./data/hermes:/opt/data
      - ./hermes/03-jarvis-config:/etc/cont-init.d/03-jarvis-config:ro
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro # JARVIS persona (versioned in git)
      - ./hermes/plugins/jarvis-memory:/opt/data/plugins/jarvis-memory:ro # shared memory provider (ADR-018)
      - ./data/dev-mirror/upstream.git:/opt/upstream.git:ro # current JARVIS main, for performance work (ADR-026)
      # Cross-app visibility (FS-104 / BR-003), read-only
      - ./data/npm/logs:/opt/external/proxy_logs:ro
      - /var/log:/opt/external/host_logs:ro
    environment:
      - HERMES_UID=${HOST_UID:-1000}
      - HERMES_GID=${HOST_GID:-1000}
      - LLM_GATEWAY_KEY=${LLM_GATEWAY_KEY}
      # OpenAI-compatible API, reachable only inside jarvis-network (called by jarvis-core)
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY}
      # JARVIS' own tools (memory, the owner, the phone's screen, documents, approvals, n8n) via jarvis-tools
      - MCP_TOKEN=${MCP_TOKEN}
      - TZ=${TZ}
      # lean while Hermes runs on the local CPU (fewer prompt tokens), full with cloud models (ADR-031)
      - HERMES_PROFILE=${HERMES_PROFILE:-lean}
    networks:
      - jarvis-network
    depends_on:
      - jarvis-tools

  # 2a. LOCAL MODELS (llama.cpp, Qwen3.5). Default AI when no cloud key/credit (decision 2026-10-21).
  # Measured on this CPU: 2B ~42 tok/s read, ~7 tok/s write, and with the static prompt prefix cached
  # a chat reply in ~1.5 s; 4B ~20 / ~4.7 tok/s. Shared memory via mmap; models: scripts/get-models.sh.
  llama-chat: # CPU class 1: answers the owner (small context, prompt cache)
    image: ghcr.io/ggml-org/llama.cpp:server-b11749
    container_name: jarvis-llm-chat
    restart: always
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cpu_shares: 1024
    mem_limit: 3g
    # --mmproj: the 2B model can SEE (photos the owner attaches, camera, shared screen). Measured: a 450×1000 picture
    # = 459 tokens ≈ 55 s on this CPU; text in pictures is read almost perfectly (ADR-032).
    command: ["-m", "/models/Qwen3.5-2B-Q4_0.gguf", "--mmproj", "/models/mmproj-2B-F16.gguf", "-c", "16384", "-np", "1", "-t", "4",
              "-ctk", "q8_0", "-ctv", "q8_0",
              "--jinja", "--host", "0.0.0.0", "--port", "8080", "--no-webui",
              "--slot-save-path", "/slots", "--cache-ram", "1024", "--alias", "qwen-lokal"]
    volumes:
      - ./data/models:/models:ro
      - ./data/llm-slots/chat:/slots
    networks:
      - jarvis-network

  llama-worker: # CPU class 2: Hermes' local brain (64k context), idle-priority so it never slows the owner
    image: ghcr.io/ggml-org/llama.cpp:server-b11749
    container_name: jarvis-llm-worker
    restart: always
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cpu_shares: 128
    mem_limit: 8g # model 2.7 GB + KV + 4 GB prompt cache (ADR-031)
    entrypoint: ["chrt", "-i", "0", "nice", "-n", "19", "/app/llama-server"]
    # -b 512: a cancelled request stops within ~30 s (llama.cpp checks between batches; 2048 took 2–4 min on this CPU)
    # CPU limit: 2 of 4 threads while only JARVIS' background work runs, all 4 for the owner's (ops.py → usage-collector.sh)
    command: ["-m", "/models/Qwen3.5-4B-Q4_K_M.gguf", "-c", "65536", "-np", "1", "-t", "4", "-b", "512", "-ctk", "q8_0", "-ctv", "q8_0",
              "--jinja", "--host", "0.0.0.0", "--port", "8080", "--no-webui",
              "--slot-save-path", "/slots", "--cache-ram", "4096", "--alias", "qwen-lokal"]
    volumes:
      - ./data/models:/models:ro
      - ./data/llm-slots/worker:/slots
    networks:
      - jarvis-network

  # 2a'. LOCAL HEARING (faster-whisper + sherpa-onnx voiceprint/diarization) — CPU class 1
  jarvis-ears:
    build: ./ears
    image: jarvis-ears:local
    container_name: jarvis-ears
    restart: always
    cpu_shares: 1024
    mem_limit: 3g
    environment:
      - WHISPER_LIVE_MODEL=${WHISPER_LIVE_MODEL:-small}
      - WHISPER_FILE_MODEL=${WHISPER_FILE_MODEL:-small}
      - WHISPER_MEETING_BEAM=${WHISPER_MEETING_BEAM:-2}
    volumes:
      - ./data/models:/models
      - ./data/meetings:/meetings:ro # meeting chunks written by jarvis-core
    networks:
      - jarvis-network

  # 2b. CORE SERVICE — https://${BACKEND_DOMAIN}: device auth, WSS, tiered routing, approvals,
  #     memory, usage. The only public entry point to the agent.
  jarvis-core:
    build: ../core
    image: jarvis-core:local
    container_name: jarvis-core
    restart: always
    volumes:
      - ./data/documents:/data/documents
      - ./data/meetings:/data/meetings
      - ./data/media:/data/media
      - ./data/attachments:/data/attachments # files and pictures attached in the chat (30 days)
      - ./data/dev:/data/dev # self-improvement requests/results exchanged with infra/scripts/self-dev.sh
      - ./data/ops:/data/ops # per-container usage (usage-collector.sh) and "netralkan" requests (ops.sh)
      - ./data/hermes:/hermes:ro # Hermes Studio (schedules, own skills, kanban) + cron result delivery
    environment: &core-env
      - DATABASE_URL=postgresql://jarvis_core:${JARVIS_DB_PASSWORD}@jarvis-db/jarvis
      - HERMES_API_KEY=${HERMES_API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # Cloud AI is optional: no key = that provider is skipped and the local model answers (gateway.py)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_KEY_CHAT=${OPENROUTER_KEY_CHAT:-}
      - OPENROUTER_KEY_HERMES=${OPENROUTER_KEY_HERMES:-}
      - OPENROUTER_KEY_LATAR=${OPENROUTER_KEY_LATAR:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MP3_CONVERTER_URL=${MP3_CONVERTER_URL:-}
      - MP3_CONVERTER_KEY=${MP3_CONVERTER_KEY:-}
      - JARVIS_BUDGET_USD=${JARVIS_BUDGET_USD:-20}
      - LLM_GATEWAY_KEY=${LLM_GATEWAY_KEY}
      - VAULT_KEY=${VAULT_KEY}
      - JARVIS_RO_DATABASE_URL=postgresql://jarvis_ro:${JARVIS_RO_PASSWORD}@jarvis-db/jarvis
      - WHISPER_URL=http://jarvis-ears:8000
      - ORS_API_KEY=${ORS_API_KEY:-}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - DOCUMENTS_DIR=/data/documents
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-6}
      - QUIET_HOURS=${QUIET_HOURS-22:00-06:00}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-2}
      - DEEPGRAM_KEYWORDS=${DEEPGRAM_KEYWORDS:-}
      - CORE_ADMIN_TOKEN=${CORE_ADMIN_TOKEN}
      - MCP_TOKEN=${MCP_TOKEN}
      - TZ=${TZ}
    networks:
      - jarvis-network
    depends_on:
      core-db-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  # 2c. MCP TOOL SERVER for Hermes (internal only): memory, approval requests, n8n drafts
  jarvis-tools:
    image: jarvis-core:local
    container_name: jarvis-tools
    restart: always
    command: ["python", "-m", "app.mcp_server"]
    volumes:
      - ./data/documents:/data/documents
    environment: *core-env
    networks:
      - jarvis-network
    depends_on:
      jarvis-core:
        condition: service_started

  # one-shot: least-privilege role + database for jarvis-core (idempotent)
  core-db-init:
    image: postgres:16.15-alpine
    restart: "no"
    entrypoint: ["/init-core-db.sh"]
    volumes:
      - ./postgres/init-core-db.sh:/init-core-db.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JARVIS_DB_PASSWORD=${JARVIS_DB_PASSWORD}
      - JARVIS_RO_PASSWORD=${JARVIS_RO_PASSWORD}
    networks:
      - jarvis-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. WORKFLOW AUTOMATION
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    container_name: jarvis-executor
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=jarvis-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_HOST=${FLOW_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${FLOW_DOMAIN}/
      - WEBHOOK_URL=https://${FLOW_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - jarvis-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # 4. SEMANTIC MEMORY (vector DB)
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: jarvis-memory
    restart: always
    ports:
      - "127.0.0.1:6333:6333" # dashboard: ssh -L 6333:localhost:6333
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - jarvis-network

  # 5. RELATIONAL PERSISTENCE
  postgres-db:
    image: postgres:16.15-alpine
    container_name: jarvis-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-network
