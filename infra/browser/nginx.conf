# Gateway in front of the shared Chromium (Blueprint v4 Fase 7, ADR-051). Chromium refuses DevTools requests whose Host header is
# not localhost or an IP, so a hostname like "jarvis-browser" fails; this proxy presents "localhost" to Chromium and rewrites the
# websocket address it advertises. Internal network only; nothing here is published.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 9222;
    location / {
      proxy_pass http://jarvis-browser:9222;
      proxy_http_version 1.1;
      proxy_set_header Host localhost;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/json;
      sub_filter_once off;
      sub_filter 'ws://localhost/' 'ws://jarvis-browser-gw:9222/';
      sub_filter 'localhost:9222' 'jarvis-browser-gw:9222';
    }
  }
}
